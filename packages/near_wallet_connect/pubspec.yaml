name: near_wallet_connect
description: >-
  Drop-in NEAR wallet connection for Flutter — adaptive connect (web redirect,
  mobile deep links), persistent key storage, and a NearConnectButton widget.
version: 0.5.1
homepage: https://github.com/0xjesus/near_dart
repository: https://github.com/0xjesus/near_dart
topics:
  - near
  - wallet
  - flutter
  - web3
  - blockchain

screenshots:
  - description: Multi-wallet connection in Flutter
    path: screenshots/wallet-connect.png

environment:
  sdk: ^3.9.0
  flutter: ">=3.10.0"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  flutter:
    sdk: flutter
  near_dart: ^0.6.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.2
  app_links: ^7.0.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences_web: ^2.4.3
