name: Sync NEAR OpenAPI client

# Keeps packages/near_jsonrpc_client in sync with nearcore's published
# OpenAPI spec: re-fetches the spec, regenerates the typed client, and
# commits to main if anything changed (no PR — GITHUB_TOKEN PRs request
# Tests and then sit in action_required with zero jobs).
on:
  schedule:
    - cron: '0 7 * * 1' # weekly, Mondays 07:00 UTC
  workflow_dispatch:

jobs:
  sync:
    name: Regenerate from upstream spec
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    defaults:
      run:
        working-directory: packages/near_jsonrpc_client
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Fetch latest nearcore OpenAPI spec
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/near/nearcore/master/chain/jsonrpc/openapi/openapi.json \
            -o tool/openapi.json

      - name: Install deps & regenerate
        run: |
          dart pub get
          dart run tool/generate.dart
          dart format lib/src/models.g.dart lib/src/client.g.dart

      - name: Verify the regenerated client still analyzes
        run: dart analyze

      # Do not open a GITHUB_TOKEN PR: those PRs request Tests and then sit
      # in action_required with zero jobs. Push to main, then dispatch Tests.
      - name: Commit generated client to main
        id: commit
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/near_jsonrpc_client/tool/openapi.json \
            packages/near_jsonrpc_client/lib/src/models.g.dart \
            packages/near_jsonrpc_client/lib/src/client.g.dart
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No OpenAPI client changes"
            exit 0
          fi
          git commit -m "chore: sync NEAR JSON-RPC client with upstream OpenAPI spec"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch Tests on main
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: gh workflow run Tests --ref main
